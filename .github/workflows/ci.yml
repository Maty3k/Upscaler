name: CI

on:
  push:
    branches: [main]  # PRs are covered by pull_request; '**' ran everything twice
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Install a CPU-only torch first — it's the slow step, so it must be cached
      # and kept off the GPU wheels. The PyTorch CPU wheel index is used on Linux;
      # macOS/Windows PyPI wheels are already CPU-only, so plain pip is correct there.
      - name: Install CPU torch (Linux)
        if: runner.os == 'Linux'
        run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Install CPU torch (macOS / Windows)
        if: runner.os != 'Linux'
        run: pip install "torch>=2.0"

      # [face] included so face-restoration / CodeFormer / colorize / spandrel
      # tests actually run instead of silently skipping.
      - name: Install package
        run: pip install -e ".[dev,gui,face,video]"

      # Model weights are immutable once pinned — cache them instead of pulling
      # ~330MB from third-party hosts on every run. Keyed on the registries.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: upscaler/weights
          key: weights-${{ hashFiles('upscaler/models/registry.py', 'upscaler/background.py') }}

      - name: Run tests
        run: pytest -q

      - name: Import app
        run: python -c "import app"

      - name: List models
        run: upscaler --list-models
