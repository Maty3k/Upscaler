[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upscaler"
version = "0.1.0"
description = "Local, open-source image upscaling + sharpening. Wraps pretrained Real-ESRGAN weights."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Upscaler contributors" }]
keywords = ["super-resolution", "upscaling", "real-esrgan", "image-enhancement", "sharpening"]
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "Pillow>=9.0",
    "tqdm>=4.64",
]

[project.optional-dependencies]
# gradio is required: several tests import app.py at collection time, so a
# plain `pip install -e ".[dev]" && pytest` (the documented flow) needs it.
dev = ["pytest>=7.0", "gradio>=6.0", "onnxruntime>=1.16", "onnx>=1.15", "onnxscript>=0.1", "pypdfium2>=4", "pillow-heif>=0.13", "imageio-ffmpeg>=0.4"]
# app.py uses Gradio 6 APIs (ImageSlider, buttons=, launch(theme=…)) — older
# majors fail at startup, so the floor must match.
gui = ["gradio>=6.0", "pypdfium2>=4", "pillow-heif>=0.13", "onnxruntime>=1.16"]
pdf = ["pypdfium2>=4"]
# onnxscript is only needed to *export* (torch's modern exporter); pure
# inference needs just onnxruntime.
onnx = ["onnxruntime>=1.16", "onnx>=1.15", "onnxscript>=0.1"]
# AMD/Intel GPU on native Windows for the ONNX engine (DirectML). NOTE: this
# provides the same `onnxruntime` module as the CPU package — uninstall
# `onnxruntime` first, then install this extra on its own.
directml = ["onnxruntime-directml>=1.17", "onnx>=1.15", "onnxscript>=0.1"]
# Video needs an ffmpeg binary: a system install, or this bundled fallback.
video = ["imageio-ffmpeg>=0.4"]
# Face restoration: spandrel loads GFPGAN (no basicsr), opencv-python provides
# the YuNet detector. Old-arch GFPGAN lives in spandrel_extra_arches.
face = ["spandrel>=0.4", "spandrel_extra_arches>=0.2", "opencv-python-headless>=4.9"]

[project.scripts]
upscaler = "upscaler.cli:main"

[tool.setuptools.packages.find]
include = ["upscaler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
